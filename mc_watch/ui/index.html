<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>mc-watch</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="panel" id="app">
    <header class="hd" id="header">
      <h1>MC Watch</h1>
      <div class="actions">
        <button id="btn-add" type="button" disabled
                title="Agregar servidor (próximamente)" aria-label="Agregar servidor">
          <i class="ic" aria-hidden="true">&#xE710;</i>
        </button>
        <button id="btn-pin" type="button" aria-pressed="false"
                title="Fijar panel" aria-label="Fijar panel">
          <i class="ic" aria-hidden="true">&#xE718;</i>
        </button>
        <button id="btn-close" type="button"
                title="Cerrar (Esc)" aria-label="Cerrar panel">
          <i class="ic" aria-hidden="true">&#xE711;</i>
        </button>
      </div>
    </header>

    <h2 class="sec" id="section-title">Servidores</h2>

    <div id="list" aria-live="polite">
      <ul id="servers"></ul>
      <div id="empty" hidden>
        <p>No hay servidores configurados.</p>
        <p class="hint">Agrégalos en el archivo de configuración:</p>
        <code id="config-path"></code>
      </div>
    </div>

    <hr>
    <footer class="ft" id="footer">
      <span id="updated">Actualizando…</span>
      <span id="version"></span>
    </footer>
  </main>

  <script src="app.js"></script>
</body>
</html>
